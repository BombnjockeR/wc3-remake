<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pyro TD 0.31 (web port)</title>
<style>
  :root { --bg: #0e1116; --panel: #161b22; --panel2: #1f2630; --line: #2d3742; --text: #e6e8eb; --dim: #9aa4ae; --gold: #ffd23f; --accent: #6cc3ff; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.35 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; overflow: hidden; }
  button { font: inherit; color: inherit; cursor: pointer; }
  #app { display: grid; grid-template-columns: 220px 1fr 300px; grid-template-rows: 40px 1fr; height: 100vh; }
  #top { grid-column: 1 / 4; display: flex; align-items: center; gap: 16px; padding: 0 12px; background: var(--panel); border-bottom: 1px solid var(--line); white-space: nowrap; overflow: hidden; }
  #top .k { color: var(--dim); margin-right: 4px; }
  #top .gold { color: var(--gold); font-weight: 700; font-size: 15px; }
  #top .grow { flex: 1; }
  #top button { background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; }
  #top button.on { background: #2b6cb0; border-color: #3b82c4; }
  #timer { font-weight: 600; color: #fff; }
  #left { background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; padding: 8px; }
  #left h4, #right h4 { margin: 4px 0 8px; color: var(--dim); font-weight: 600; text-transform: uppercase; font-size: 11px; letter-spacing: .06em; }
  .bbtn { display: grid; grid-template-columns: 30px 1fr auto; align-items: center; gap: 8px; width: 100%; text-align: left; padding: 5px 6px; margin-bottom: 4px; background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; }
  .bbtn:disabled { opacity: .45; cursor: not-allowed; }
  .bbtn.placing { outline: 2px solid var(--accent); }
  .bbtn .ico, .ico { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 5px; color: #111; font-weight: 800; font-size: 12px; }
  .cost { color: var(--gold); font-weight: 700; }
  #mid { position: relative; overflow: hidden; }
  #view { width: 100%; height: 100%; display: block; cursor: crosshair; }
  #log { position: absolute; left: 10px; bottom: 10px; max-width: 60%; pointer-events: none; }
  .msg { background: rgba(0,0,0,.55); padding: 3px 8px; border-radius: 4px; margin-top: 3px; transition: opacity 1s; }
  .msg.fade { opacity: 0; }
  #right { background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; overflow: hidden; }
  #minimap { width: 100%; aspect-ratio: 6272 / 10240; max-height: 42vh; display: block; background: #000; cursor: pointer; }
  #castles { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 8px; border-bottom: 1px solid var(--line); }
  #castles div { background: var(--panel2); border-radius: 6px; padding: 5px 7px; }
  #castles .t0 { border-left: 3px solid #ff4d4d; } #castles .t1 { border-left: 3px solid #4d8dff; }
  #panel { padding: 10px; overflow-y: auto; flex: 1; }
  #panel .title { font-size: 15px; font-weight: 700; margin-bottom: 6px; }
  #panel .owner { font-size: 12px; font-weight: 500; margin-left: 6px; }
  #panel .stats { color: var(--dim); margin-bottom: 8px; }
  #panel .stats b { color: var(--text); }
  #panel .tip { background: var(--panel2); border-radius: 6px; padding: 6px 8px; margin-bottom: 8px; color: #cfd5db; }
  #panel .abils span { display: inline-block; background: #2a3340; border-radius: 4px; padding: 2px 6px; margin: 0 4px 4px 0; font-size: 12px; }
  #panel .building { color: var(--accent); margin-bottom: 8px; }
  .act { display: flex; justify-content: space-between; gap: 8px; width: 100%; text-align: left; padding: 6px 8px; margin-bottom: 4px; background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; }
  .act:disabled { opacity: .45; cursor: not-allowed; }
  .act.buy { border-color: #5a4a1a; }
  .act.sell { border-color: #6b2b2b; }
  .act .lvl { color: var(--dim); margin-left: auto; margin-right: 6px; }
  .hint { color: var(--dim); }
  .modal { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(5,8,12,.72); z-index: 20; }
  .modal.hidden, .hidden { display: none !important; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 22px 26px; width: min(560px, 92vw); max-height: 90vh; overflow: auto; }
  .card h1 { margin: 0 0 4px; font-size: 26px; }
  .card .sub { color: var(--dim); margin-bottom: 14px; }
  .row { display: flex; gap: 10px; margin: 8px 0; align-items: center; }
  .row label { width: 120px; color: var(--dim); }
  select, input { background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font: inherit; }
  .primary { background: #2b6cb0; border: 0; border-radius: 8px; padding: 10px 18px; font-weight: 700; margin-top: 12px; }
  #dialog { position: absolute; top: 18px; left: 50%; transform: translateX(-50%); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; z-index: 10; min-width: 260px; text-align: center; box-shadow: 0 8px 30px rgba(0,0,0,.5); }
  .dtitle { font-size: 16px; font-weight: 700; margin-bottom: 10px; }
  .dtitle small { color: var(--dim); font-weight: 400; }
  .dbtn { display: block; width: 100%; padding: 8px 12px; margin: 6px 0; background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; font-weight: 600; }
  .dbtn:hover, .act:hover:not(:disabled), .bbtn:hover:not(:disabled) { border-color: var(--accent); }
  .dtime { color: var(--dim); margin-top: 6px; }
  #over { z-index: 30; }
  #over > div, #over .dtitle { text-align: center; }
  #tip { position: fixed; z-index: 50; max-width: 340px; background: #0b0f14; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; pointer-events: none; box-shadow: 0 6px 20px rgba(0,0,0,.5); }
  #questBody h3 { margin: 14px 0 4px; font-size: 14px; }
  #questBody p { margin: 0; color: #cfd5db; }
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <span><span class="k">Round</span><b id="round">1</b></span>
    <span id="timer"></span>
    <span><span class="k">Gold</span><span class="gold" id="gold">0</span></span>
    <span><span class="k">Mode</span><span id="mode"></span></span>
    <span id="clock"></span>
    <span class="grow"></span>
    <button id="unstuck" title="Same as the -unstuck chat command">Unstuck</button>
    <button id="pause">❚❚</button>
    <button data-speed="1">1×</button><button data-speed="2">2×</button><button data-speed="4">4×</button>
    <button id="info">Info</button>
  </div>
  <div id="left"><h4>Build</h4><div id="build"></div></div>
  <div id="mid"><canvas id="view"></canvas><div id="log"></div><div id="dialog" class="hidden"></div></div>
  <div id="right">
    <canvas id="minimap" width="220" height="359"></canvas>
    <div id="castles">
      <div class="t0">Team 1 castle<br><b id="castle0"></b> <small id="race0"></small></div>
      <div class="t1">Team 2 castle<br><b id="castle1"></b> <small id="race1"></small></div>
    </div>
    <div id="panel"></div>
  </div>
</div>

<div id="lobby" class="modal">
  <div class="card">
    <h1 id="lobbyTitle">Pyro TD</h1>
    <div class="sub" id="lobbyDesc"></div>
    <div class="row"><label>Your name</label><input id="pname" value="You"></div>
    <div class="row"><label>Players per team</label><select id="perTeam"><option value="1">1 vs 1</option><option value="2" selected>2 vs 2</option><option value="3">3 vs 3</option><option value="4">4 vs 4</option></select></div>
    <div class="row"><label>Your team</label><select id="team"><option value="0">Team 1 (north)</option><option value="1">Team 2 (south)</option></select></div>
    <div class="row"><label>Seed (optional)</label><input id="seed" placeholder="random"></div>
    <div class="sub" style="margin-top:10px">Other slots are filled by computer players. Local test build — graphics are placeholders.</div>
    <button class="primary" id="start">Start game</button>
  </div>
</div>
<div id="over" class="modal hidden"></div>
<div id="quests" class="modal hidden"><div class="card"><h1>Info</h1><div id="questBody"></div></div></div>
<div id="tip" class="hidden"></div>

<script src="src/gamedata.js"></script>
<script src="src/engine.js"></script>
<script src="src/rules.js"></script>
<script src="src/ai.js"></script>
<script src="src/ui.js"></script>
</body>
</html>
